name: always_victory
description: "Always Victory Flutter Application"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+8

environment:
  sdk: ^3.10.8

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  # Flutter SDK Dependency
  flutter:
    sdk: flutter

  # Icons
  # Cupertino Icons for iOS-style UI icons
  cupertino_icons: ^1.0.8

  # State Management & Navigation
  # GetX for state management, dependency injection, and reactive routing
  get: ^4.6.6

  # Networking
  # HTTP client for API requests and remote server communication
  http: ^1.2.1

  # Local Storage & Persistence
  # Key-value persistent storage across platforms
  shared_preferences: ^2.3.2
  # Fast, lightweight in-memory and disk key-value storage engine
  get_storage: ^2.1.1

  # UI & Design Components
  # Access to Google Fonts library
  google_fonts: ^6.2.1
  # Interactive charts and graphs rendering
  fl_chart: ^0.69.0
  # Lottie vector animation renderer
  lottie: ^3.1.2
  # Display network images with caching and placeholder support
  cached_network_image: ^3.3.1
  # Shimmer loading skeleton effect animation
  shimmer: ^3.0.0

  # Utilities & Helpers
  # Internationalization, date, and number formatting
  intl: ^0.19.0
  # Unique identifier (UUID) generator
  uuid: ^4.4.2

  # Navigation & Layout
  # Animated curved bottom navigation bar widget
  curved_navigation_bar: ^1.0.6
  # Scrollable list supporting jump/scroll to specific item index
  scrollable_positioned_list: ^0.3.8

  # Media & Graphics
  # Palette generator to extract prominent colors from images
  palette_generator_master: ^1.1.0
  # Image and widget carousel slider
  carousel_slider: ^5.1.2

  # Payment Gateway
  # Razorpay payment integration SDK
  razorpay_flutter: ^1.4.5

  # Document & PDF Viewing
  # Syncfusion PDF viewer for rendering PDF files inside the app
  syncfusion_flutter_pdfviewer: ^28.2.12

  # Video & Web Content
  # Native video player widget for playing online and local videos
  video_player: ^2.11.1
  # Embedded webview controller for rendering web pages
  webview_flutter: ^4.14.1
  # Launch URLs, phone calls, SMS, and email links in external apps
  url_launcher: ^6.3.2

  # File & Image Pickers
  # Native file selection dialog for choosing system files
  file_picker: ^11.0.2
  # Pick photos and videos from camera or photo library
  image_picker: ^1.2.3
  # Cross-platform path manipulation functions
  path: ^1.9.1

  # Sharing & Accessibility
  # Cross-platform sharing of text, links, and files
  share_plus: ^12.0.2
  # Text-To-Speech (TTS) engine integration
  flutter_tts: ^3.8.5

  # Launcher Icons Generation
  # Package for automatically generating launcher app icons for Android & iOS
  flutter_launcher_icons: ^0.14.4
  qr_flutter: ^4.1.0

# Configuration for flutter_launcher_icons tool to build Android/iOS app icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#FF5722"
  adaptive_icon_foreground: "assets/images/logo.png"

dev_dependencies:
  # Flutter Test SDK for unit and widget testing
  flutter_test:
    sdk: flutter

  # Lint rules for Dart and Flutter code quality and best practices
  flutter_lints: ^6.0.0

# Flutter-specific configuration options
flutter:

  # Includes Material Icons font for Material Design UI elements
  uses-material-design: true

  # Asset management: Register assets (images, fonts, JSONs, etc.) here
  # assets:
  #   - assets/images/logo.png

  # Custom Font definitions: Register custom fonts here
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: fonts/CustomFont-Regular.ttf
